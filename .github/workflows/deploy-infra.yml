name: Deploy infra

on:
  push:
    branches:
      - aurendev-CICD_AWS_TEST
    paths:
      - 'infra/**'
      - '.github/workflows/deploy-infra.yml'
  workflow_dispatch:

# OIDC requires id-token: write. contents: read is the default minimum.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-infra-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: cdk deploy frontend stack
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: GitHubActions-FatchadDeploy

      # The bootstrap stack is intentionally excluded from CI — it manages the
      # very role this workflow is using, and changing it from inside its own
      # session is asking for trouble. Deploy it manually with `cdk deploy
      # FatchadBootstrapStack` from a laptop when IAM trust changes.
      #
      # FatchadDataStack is also excluded — it ships via deploy-data.yml on
      # `database-v*` tags so every schema change has a named version.
      - name: CDK synth
        run: npx cdk synth FatchadFrontendStack

      - name: CDK diff
        run: npx cdk diff FatchadFrontendStack || true

      - name: CDK deploy
        run: npx cdk deploy FatchadFrontendStack --require-approval never --outputs-file cdk-outputs.json

      - name: Show stack outputs
        run: cat cdk-outputs.json
