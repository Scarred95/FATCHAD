name: Deploy frontend

# Triggers:
#   - Pushing a tag matching `frontend-v*` (e.g. frontend-v0.1.0).
#   - Manual run via the Actions UI ("Run workflow").
#
# Branch pushes do NOT trigger this. Use a tag.
on:
  push:
    tags:
      - 'frontend-v*'
  workflow_dispatch:
    inputs:
      version_label:
        description: 'Version string baked into the build (defaults to git short sha)'
        required: false
        default: ''

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and sync to S3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Resolve version label
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            # Strip the `frontend-` prefix: "frontend-v0.1.0" -> "v0.1.0"
            echo "label=${GITHUB_REF_NAME#frontend-}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ inputs.version_label }}" ]]; then
            echo "label=${{ inputs.version_label }}" >> "$GITHUB_OUTPUT"
          else
            echo "label=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # OIDC role assume happens BEFORE the build so the build step can read
      # the API URL out of CloudFormation. The role has scoped permissions:
      # S3 sync to fatchad-frontend + DescribeStacks on FatchadApiStack only.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_FRONTEND_UPLOAD_ROLE_ARN }}
          aws-region: eu-central-1
          role-session-name: GitHubActions-FrontendDeploy-${{ steps.ver.outputs.label }}

      # Pull the HTTP API base URL from FatchadApiStack outputs so the SPA
      # build embeds the real endpoint. No GitHub secret to keep in sync —
      # the CDK stack is the single source of truth. If the stack doesn't
      # exist yet (first deploy, or someone destroyed it), the build still
      # proceeds with empty values and the runtime falls back to `/api`,
      # which won't reach anything on S3 but won't break the build either.
      - name: Resolve API base URL from CloudFormation
        id: api
        run: |
          set -euo pipefail
          URL=$(aws cloudformation describe-stacks \
            --stack-name FatchadApiStack \
            --region eu-central-1 \
            --query "Stacks[0].Outputs[?OutputKey=='HttpApiUrl'].OutputValue" \
            --output text 2>/dev/null || true)
          if [[ -z "$URL" || "$URL" == "None" ]]; then
            echo "::warning::FatchadApiStack/HttpApiUrl not found — building with empty API base URL"
            URL=""
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Resolved API URL: $URL"

      # Pull the Cognito pool + client IDs from FatchadCognitoStack outputs so
      # the SPA's auth store can talk to the right pool. Same source-of-truth
      # pattern as the API URL above — no GitHub secret to keep in sync. These
      # IDs are not secret; they ship inside the bundle by design. (The upload
      # role's DescribeStacks must include FatchadCognitoStack — see
      # bootstrap-stack.ts.)
      - name: Resolve Cognito IDs from CloudFormation
        id: cognito
        run: |
          set -euo pipefail
          POOL_ID=$(aws cloudformation describe-stacks \
            --stack-name FatchadCognitoStack \
            --region eu-central-1 \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolId'].OutputValue" \
            --output text 2>/dev/null || true)
          CLIENT_ID=$(aws cloudformation describe-stacks \
            --stack-name FatchadCognitoStack \
            --region eu-central-1 \
            --query "Stacks[0].Outputs[?OutputKey=='UserPoolClientId'].OutputValue" \
            --output text 2>/dev/null || true)
          if [[ -z "$POOL_ID" || "$POOL_ID" == "None" || -z "$CLIENT_ID" || "$CLIENT_ID" == "None" ]]; then
            echo "::warning::FatchadCognitoStack outputs not found — building without Cognito config; auth will not work"
            POOL_ID=""
            CLIENT_ID=""
          fi
          echo "pool_id=$POOL_ID" >> "$GITHUB_OUTPUT"
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved User Pool: $POOL_ID"

      # Pull the CloudFront distribution id from FatchadFrontendStack so we can
      # invalidate the edge cache after the sync. Empty if CloudFront isn't
      # provisioned yet (domain not wired) — the invalidation step then no-ops.
      - name: Resolve CloudFront distribution id
        id: cdn
        run: |
          set -euo pipefail
          DIST_ID=$(aws cloudformation describe-stacks \
            --stack-name FatchadFrontendStack \
            --region eu-central-1 \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text 2>/dev/null || true)
          if [[ -z "$DIST_ID" || "$DIST_ID" == "None" ]]; then
            echo "::warning::FatchadFrontendStack/DistributionId not found — skipping cache invalidation"
            DIST_ID=""
          fi
          echo "dist_id=$DIST_ID" >> "$GITHUB_OUTPUT"
          echo "Resolved distribution: $DIST_ID"

      - name: Build
        working-directory: frontend
        env:
          VITE_APP_VERSION: ${{ steps.ver.outputs.label }}
          # Gameplay/public surface lives at the HTTP API root.
          VITE_API_BASE_URL: ${{ steps.api.outputs.url }}
          # Admin routes are mounted under `/admin` on the same API. If we
          # ever route admin through a separate domain, override this var.
          VITE_ADMIN_API_BASE_URL: ${{ steps.api.outputs.url }}/admin
          # Cognito config consumed by src/stores/authStore.ts.
          VITE_COGNITO_USER_POOL_ID: ${{ steps.cognito.outputs.pool_id }}
          VITE_COGNITO_APP_CLIENT_ID: ${{ steps.cognito.outputs.client_id }}
        run: npm run build

      - name: Sync hashed assets (long cache)
        run: |
          aws s3 sync frontend/dist/ s3://fatchad-frontend/ \
            --delete \
            --exclude "index.html" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload index.html (short cache)
        # Done separately because index.html needs `max-age=60` so users pick
        # up the new build within a minute. Hashed JS/CSS gets 1-year cache
        # because the filename changes whenever the content changes.
        run: |
          aws s3 cp frontend/dist/index.html s3://fatchad-frontend/index.html \
            --cache-control "public, max-age=60, must-revalidate" \
            --content-type "text/html; charset=utf-8"

      # Bust the CloudFront edge cache so the new build is served immediately.
      # `/*` counts as a single invalidation path (well within the 1,000/month
      # free allowance). No-ops when CloudFront isn't wired yet.
      - name: Invalidate CloudFront cache
        if: steps.cdn.outputs.dist_id != ''
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.cdn.outputs.dist_id }}" \
            --paths "/*"

      - name: Summary
        run: |
          echo "### Deployed frontend ${{ steps.ver.outputs.label }}" >> $GITHUB_STEP_SUMMARY
          echo "- Bucket: \`s3://fatchad-frontend\`" >> $GITHUB_STEP_SUMMARY
          echo "- S3 URL: http://fatchad-frontend.s3-website.eu-central-1.amazonaws.com" >> $GITHUB_STEP_SUMMARY
          if [[ -n "${{ steps.cdn.outputs.dist_id }}" ]]; then
            echo "- Live URL: https://fatchad.de" >> $GITHUB_STEP_SUMMARY
            echo "- CloudFront cache invalidated (\`/*\`)" >> $GITHUB_STEP_SUMMARY
          fi
